<!DOCTYPE html>
<html>
<head>
  <title>Auto Clipper</title>
</head>
<body>
  <h1>Auto Clipper MVP</h1>

  <input type="file" id="fileInput" />
  <button onclick="upload()">Upload</button>
  <button onclick="generate()">Generate</button>

  <p id="status"></p>

  <script>
    const API_URL = "PASTE_YOUR_BACKEND_URL_HERE";

    let uploadedPath = "";

    async function upload() {
      const file = document.getElementById("fileInput").files[0];
      const formData = new FormData();
      formData.append("file", file);

      const res = await fetch(`${API_URL}/upload`, {
        method: "POST",
        body: formData
      });

      const data = await res.json();
      uploadedPath = data.file_path;

      document.getElementById("status").innerText = "Uploaded!";
    }

    async function generate() {
      const res = await fetch(`${API_URL}/generate?file_path=${uploadedPath}`, {
        method: "POST"
      });

      const data = await res.json();
      const jobId = data.job_id;

      checkStatus(jobId);
    }

    async function checkStatus(jobId) {
      const interval = setInterval(async () => {
        const res = await fetch(`${API_URL}/status/${jobId}`);
        const data = await res.json();

        document.getElementById("status").innerText = data.status;

        if (data.status === "done") {
          clearInterval(interval);
          window.open(`${API_URL}/result/${jobId}`);
        }
      }, 2000);
    }
  </script>
</body>
</html>
