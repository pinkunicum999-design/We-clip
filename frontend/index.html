<!DOCTYPE html>
<html>
<head>
  <title>WeClip AI</title>
  <style>
    body {
      font-family: Arial;
      background: #0f172a;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      background: #1e293b;
      padding: 30px;
      border-radius: 12px;
      width: 400px;
      text-align: center;
    }

    h1 {
      margin-bottom: 20px;
    }

    input {
      margin-bottom: 15px;
    }

    button {
      padding: 10px 15px;
      margin: 5px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .upload {
      background: #3b82f6;
      color: white;
    }

    .generate {
      background: #10b981;
      color: white;
    }

    #status {
      margin-top: 20px;
      font-size: 14px;
    }

    .loader {
      margin-top: 10px;
      display: none;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>🎬 WeClip AI</h1>

  <input type="file" id="fileInput" />

  <div>
    <button class="upload" onclick="upload()">Upload</button>
    <button class="generate" onclick="generate()">Generate</button>
  </div>

  <div id="status">Idle</div>
</div>

<script>
const API_URL = "PASTE_YOUR_RAILWAY_URL_HERE";

let uploadedPath = "";
let jobId = null;

async function upload() {
  const file = document.getElementById("fileInput").files[0];

  if (!file) {
    alert("Select a file first");
    return;
  }

  const formData = new FormData();
  formData.append("file", file);

  setStatus("Uploading...");

  try {
    const res = await fetch(`${API_URL}/upload`, {
      method: "POST",
      body: formData
    });

    const data = await res.json();
    uploadedPath = data.file_path;

    setStatus("✅ Uploaded");
  } catch (err) {
    setStatus("❌ Upload failed");
    console.error(err);
  }
}

async function generate() {
  if (!uploadedPath) {
    alert("Upload first!");
    return;
  }

  setStatus("⚙️ Processing...");

  try {
    const res = await fetch(`${API_URL}/generate?file_path=${uploadedPath}`, {
      method: "POST"
    });

    const data = await res.json();
    jobId = data.job_id;

    checkStatus();
  } catch (err) {
    setStatus("❌ Failed to start job");
    console.error(err);
  }
}

function checkStatus() {
  const interval = setInterval(async () => {
    try {
      const res = await fetch(`${API_URL}/status/${jobId}`);
      const data = await res.json();

      setStatus("Status: " + data.status);

      if (data.status === "done") {
        clearInterval(interval);

        const resultRes = await fetch(`${API_URL}/result/${jobId}`);
        const resultData = await resultRes.json();

        setStatus("✅ Done! Opening result...");
        window.open(resultData.download_url);
      }

      if (data.status === "error") {
        clearInterval(interval);
        setStatus("❌ Error: " + data.result);
      }

    } catch (err) {
      console.error(err);
    }
  }, 2000);
}

function setStatus(msg) {
  document.getElementById("status").innerText = msg;
}
</script>

</body>
</html>
