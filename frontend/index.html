<script>
const API_URL = "we-clip-production.up.railway.app";

let uploadedPath = "";
let jobId = null;

async function upload() {
  const file = document.getElementById("fileInput").files[0];

  if (!file) {
    alert("Select a file first");
    return;
  }

  const formData = new FormData();
  formData.append("file", file);

  document.getElementById("status").innerText = "Uploading...";

  const res = await fetch(`${API_URL}/upload`, {
    method: "POST",
    body: formData
  });

  const data = await res.json();
  uploadedPath = data.file_path;

  document.getElementById("status").innerText = "Uploaded!";
}

async function generate() {
  if (!uploadedPath) {
    alert("Upload first!");
    return;
  }

  document.getElementById("status").innerText = "Processing...";

  const res = await fetch(`${API_URL}/generate?file_path=${uploadedPath}`, {
    method: "POST"
  });

  const data = await res.json();
  jobId = data.job_id;

  checkStatus();
}

async function checkStatus() {
  const interval = setInterval(async () => {
    const res = await fetch(`${API_URL}/status/${jobId}`);
    const data = await res.json();

    document.getElementById("status").innerText = data.status;

    if (data.status === "done") {
      clearInterval(interval);

      const resultRes = await fetch(`${API_URL}/result/${jobId}`);
      const resultData = await resultRes.json();

      window.open(resultData.download_url);
    }

    if (data.status === "error") {
      clearInterval(interval);
      document.getElementById("status").innerText = "Error: " + data.result;
    }

  }, 2000);
}
</script>
